[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-content-gen"
version = "1.0.0"
description = "微信公众号内容生成系统"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "WechatContentGen Team", email = "contact@wechatcontentgen.com"}
]
maintainers = [
    {name = "WechatContentGen Team", email = "contact@wechatcontentgen.com"}
]
keywords = ["wechat", "content", "generation", "ai", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.5.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "openai>=1.0.0",
    "pydub>=0.25.1",
    "python-docx>=0.8.11",
    "markdown>=3.4.4",
    "reportlab>=4.0.4",
    "pyyaml>=6.0.1",
    "loguru>=0.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "python-dateutil>=2.8.2",
    "regex>=2023.6.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/wechatcontentgen/wechat-content-gen"
Repository = "https://github.com/wechatcontentgen/wechat-content-gen.git"
Documentation = "https://wechatcontentgen.readthedocs.io/"
"Bug Tracker" = "https://github.com/wechatcontentgen/wechat-content-gen/issues"

[project.scripts]
wechat-content-gen = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "ui*", "services*", "utils*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
    "*.egg",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
